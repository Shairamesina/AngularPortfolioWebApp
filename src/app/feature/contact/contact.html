<section class="contact" id="contact">
    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-info">
            <p class="section-label">LET'S CONNECT</p>

            <h2>Get In <span>Touch</span></h2>

            <p class="contact-description">
                Have a question or opportunity in mind?
                Feel free to reach out. I'd be happy to connect.
            </p>

            <div class="contact-list">

                <a href="mailto:mesinashaira@gmail.com" class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <span>Email</span>
                        <strong>mesinashaira@gmail.com</strong>
                    </div>
                </a>
                <a href="tel:+1-315-374-3788" class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div>
                        <span>Phone</span>
                        <strong>+1 (315) 374-3788</strong>
                    </div>
                </a>
                <a href="https://www.linkedin.com/in/shaira-mesina/" target="_blank" rel="noopener noreferrer"
                    class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </div>
                    <div>
                        <span>LinkedIn</span>
                        <strong>Connect with me</strong>
                    </div>
                </a>
                <!-- <a href="https://github.com/Shairamesina" target="_blank" rel="noopener noreferrer"
                    class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-brands fa-github"></i>
                    </div>
                    <div>
                        <span>GitHub</span>
                        <strong>View my profile</strong>
                    </div>
                </a> -->
            </div>


            <!-- SOCIALS -->
            <div class="contact-socials">

                <!-- <a href="https://github.com/Shairamesina" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a> -->

                <a href="https://www.linkedin.com/in/shaira-mesina/" target="_blank" rel="noopener noreferrer"
                    aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <a href="https://www.facebook.com/shairamesina31/" target="_blank" rel="noopener noreferrer"
                    aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="mailto:mesinashaira@gmail.com" aria-label="Email">
                    <i class="fa-solid fa-envelope"></i>
                </a>

            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="contact-form-wrapper">

            <form class="contact-form" (submit)="sendEmail($event)" method="post" enctype="text/plain">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" placeholder="Your name" required  autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Your email" required  autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input id="subject" type="text" name="subject" placeholder="What's this about?" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"
                        placeholder="Tell me about your project or opportunity..." required>
                    </textarea>
                </div>

                <button type="submit" class="send-btn">
                    Send Message
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</section>
