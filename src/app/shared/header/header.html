<header class="header">
  <div class="header-container">
    <a href="#" class="logo">Shaira Mesina</a>

    <nav class="nav" [class.open]="isMenuOpen">
      <a href="#home" (click)="closeMenu()">Home</a>
      <a href="#about" (click)="closeMenu()">About</a>
      <a href="#experience" (click)="closeMenu()">Experience</a>
      <a href="#skills" (click)="closeMenu()">Skills</a>
      <a href="#contact" (click)="closeMenu()">Contact</a>
    </nav>

    <div class="header-actions">

      <button class="theme-toggle" type="button" (click)="toggleTheme()" aria-label="Toggle theme">
        <i class="fa-solid" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode">
        </i>
      </button>

      <button class="menu-toggle" type="button" (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'">

        <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen">
        </i>

      </button>

    </div>

  </div>
</header>
